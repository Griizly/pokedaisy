name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch mGBA submodule
        run: git submodule update --init --depth=1 third_party/mgba

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install CMake
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "cmake;3.22.1"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PokeDaisy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
